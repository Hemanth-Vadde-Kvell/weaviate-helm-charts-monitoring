image:
  registry: cr.weaviate.io
  tag: 1.27.8
  repo: semitechnologies/weaviate
  pullPolicy: IfNotPresent
  pullSecrets: []

command: ["/bin/weaviate"]
args:
  - '--host'
  - '0.0.0.0'
  - '--port'
  - '8080'
  - '--scheme'
  - 'http'
  - '--config-file'
  - '/weaviate-config/conf.yaml'
  - --read-timeout=60s
  - --write-timeout=60s

initContainers:
  sysctlInitContainer:
    enabled: true
    sysctlVmMaxMapCount: 524288
    image:
      registry: docker.io
      repo: alpine
      tag: latest
      pullPolicy: IfNotPresent
  ensureFileOwnershipContainer:
    enabled: false

  extraInitContainers: {}

replicas: 1
podManagementPolicy: Parallel
updateStrategy:
  type: RollingUpdate

resources: {}

securityContext: {}
containerSecurityContext: {}

serviceAccountName:
clusterDomain: cluster.local.

storage:
  size: 32Gi
  storageClassName: ""

service:
  name: weaviate
  ports:
    - name: http
      protocol: TCP
      port: 80
  type: LoadBalancer
  loadBalancerSourceRanges: []
  clusterIP:
  annotations: {}

grpcService:
  enabled: true
  name: weaviate-grpc
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
  type: LoadBalancer
  loadBalancerSourceRanges: []
  clusterIP:
  annotations: {}

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

startupProbe:
  enabled: true
  probeType: httpGet
  probe:
    httpGet:
      path: /v1/.well-known/ready
      port: 8080
  initialDelaySeconds: 300
  periodSeconds: 60
  failureThreshold: 50
  successThreshold: 1
  timeoutSeconds: 3

livenessProbe:
  probeType: httpGet
  probe:
    httpGet:
      path: /v1/.well-known/live
      port: 8080
  initialDelaySeconds: 900
  periodSeconds: 10
  failureThreshold: 30
  successThreshold: 1
  timeoutSeconds: 3

readinessProbe:
  probeType: httpGet
  probe:
    httpGet:
      path: /v1/.well-known/ready
      port: 8080
  initialDelaySeconds: 3
  periodSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 3

terminationGracePeriodSeconds: 600

authentication:
  anonymous_access:
    enabled: true

authorization:
  rbac:
    enabled: false

query_defaults:
  limit: 100
debug: false

env:
  CLUSTER_GOSSIP_BIND_PORT: 7000
  CLUSTER_DATA_BIND_PORT: 7001
  RAFT_BOOTSTRAP_TIMEOUT: 600

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

modules:
  text2vec-transformers:
    enabled: false

offload:
  s3:
    enabled: false

backups:
  filesystem:
    enabled: false
  s3:
    enabled: false

default_vectorizer_module: none

annotations:
extraVolumeMounts: []
extraVolumes: []
nodeSelector: {}
tolerations: []
hostAliases: []
affinity: {}
priorityClassName: ""
globalPriorityClassName: ""
