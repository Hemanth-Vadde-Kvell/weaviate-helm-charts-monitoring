weaviate:
  replicas: 1
  image:
    repository: semitechnologies/weaviate
    tag: 1.14.1
  storage:
    size: 10Gi

prometheus:
  image:
    repository: prom/prometheus
    tag: v2.36.2
  storage:
    size: 10Gi

grafana:
  image:
    repository: grafana/grafana-oss
    tag: 10.2.3
  storage:
    size: 10Gi
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "200m"
      memory: "256Mi" 