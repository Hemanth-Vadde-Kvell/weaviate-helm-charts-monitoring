apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-weaviate
  labels:
    app: weaviate
spec:
  replicas: {{ .Values.weaviate.replicas | default 1 }}
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
      - name: weaviate
        image: "{{ .Values.weaviate.image.repository }}:{{ .Values.weaviate.image.tag }}"
        args:
        - --host
        - 0.0.0.0
        - --port
        - "8081"
        - --scheme
        - http
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 2112
          name: metrics
        env:
        - name: PROMETHEUS_MONITORING_ENABLED
          value: "true"
        - name: PROMETHEUS_METRICS_PORT
          value: "2112"
        - name: QUERY_DEFAULTS_LIMIT
          value: "25"
        - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
          value: "true"
        - name: PERSISTENCE_DATA_PATH
          value: "/var/lib/weaviate"
        - name: DEFAULT_VECTORIZER_MODULE
          value: "none"
        - name: ENABLE_MODULES
          value: ""
        - name: CLUSTER_HOSTNAME
          value: "node1"
        volumeMounts:
        - name: weaviate-data
          mountPath: /var/lib/weaviate
      volumes:
      - name: weaviate-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-weaviate-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-weaviate
spec:
  type: LoadBalancer
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  - port: 2112
    targetPort: 2112
    protocol: TCP
    name: metrics
  selector:
    app: weaviate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-weaviate-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.weaviate.storage.size | default "10Gi" }} 